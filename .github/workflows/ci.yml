name: CI Pipeline

# Trigger pipeline on push to main branch
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Build project (for HTML, just a message)
      - name: Build project
        run: echo "Build successful for static HTML project"

      # Step 3: Test project (optional)
      - name: Test project
        run: echo "No tests defined"

      # Step 4: Output logs
      - name: Logs
        run: echo "CI pipeline completed"
      # Step 5: Slack Notification
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

